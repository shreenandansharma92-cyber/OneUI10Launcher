name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download your code onto the GitHub runner
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java (JDK 17 is required for modern Android Gradle Plugins)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Cache Gradle files to make future builds faster
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Grant execution permissions to the Gradle wrapper
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Compile the code into a Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 6. Upload the resulting APK so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
