name: Build One UI 10 Launcher APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Debug APK
      run: |
        # Agar gradlew file nahi hai toh direct project compile script
        echo "Building Android APK via Gradle..."
        # Agar aapke paas gradlew nahi hai toh gradle command ya simple zip step
        find . -name "*.kt" -o -name "*.xml"
