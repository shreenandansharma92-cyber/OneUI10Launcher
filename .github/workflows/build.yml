name: Build One UI 10 Launcher APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Verify Kotlin and XML Files
      run: |
        echo "Checking uploaded One UI 10 source files..."
        ls -la
        if [ -f "MainActivity.kt" ] || [ -f "AndroidManifest.xml" ]; then
          echo "Source files found successfully!"
        else
          echo "Warning: Ensure files are in root directory."
        fi

    - name: Create Dummy APK Artifact for Testing
      run: |
        mkdir -p output_apk
        echo "One UI 10 Tabahi Launcher Build Package" > output_apk/README.txt
        # Packing source files into a zip artifact so you can download and check
        zip -r output_apk/OneUI10Launcher_Source.zip MainActivity.kt AndroidManifest.xml build.gradle.kts 2>/dev/null || true

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OneUI10-Launcher-Package
        path: output_apk/
